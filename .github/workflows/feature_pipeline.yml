name: Feature pipeline (hourly)

on:
  schedule:
    - cron: '5 * * * *'   # 5 minutes past every hour
  workflow_dispatch:      # manual trigger from the Actions tab

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install (lean — no TF)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests tenacity python-dotenv pytz \
            openmeteo-requests requests-cache retry-requests "hopsworks[python]" pyarrow

      - name: Run feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          CITY_NAME: Lahore
          CITY_LAT: '31.5497'
          CITY_LON: '74.3436'
          AQICN_STATION: '@8574'
        run: python -m pipelines.feature_pipeline
